<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 📱 Progressive Web App (PWA) Standards -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NH POS">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NH POS — Advanced Reports Engine</title>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Panels & Global CSS -->
    <link rel="stylesheet" href="panels.css">

    <!-- Reports CSS -->
    <link rel="stylesheet" href="reports.css">

    <!-- Global Dark Theme & Theme Sync -->
    <link rel="stylesheet" href="dark-theme.css">
    <script src="theme-sync.js"></script>
</head>
<body>

<div class="panel-container" style="margin-top: 8px;">

    <!-- ===== 📑 REPORT TABS NAVIGATION ===== -->
    <div class="report-tabs-nav" id="reportTabsNav">
        <a href="profit.html" class="report-tab-btn" style="background:#f0fdf4; border-color:#86efac; color:#15803d; text-decoration:none;">
            <i class="fas fa-sack-dollar" style="color:#10b981;"></i> <b><span data-eb-en="Profit Analytics" data-eb-ur="منافع">Profit Analytics</span></b>
        </a>
        <button class="report-tab-btn active" data-tab="sales">
            <i class="fas fa-chart-line"></i> <span data-eb-en="Sales &amp; Revenue" data-eb-ur="سیلز و آمدن">Sales &amp; Revenue</span>
        </button>
        <button class="report-tab-btn" data-tab="bestsellers">
            <i class="fas fa-trophy"></i> <span data-eb-en="Best Sellers" data-eb-ur="سب سے زیادہ بکنے والے">Best Sellers</span>
        </button>
        <button class="report-tab-btn" data-tab="slow">
            <i class="fas fa-hourglass-half"></i> <span data-eb-en="Slow &amp; Dead Stock" data-eb-ur="رکا ہوا اسٹاک">Slow &amp; Dead Stock</span>
        </button>
        <button class="report-tab-btn" data-tab="claims">
            <i class="fas fa-rotate-left"></i> <span data-eb-en="Claims &amp; Customer Returns" data-eb-ur="کلیمز و واپسی مال">Claims &amp; Customer Returns</span>
        </button>
        <button class="report-tab-btn" data-tab="damage">
            <i class="fas fa-triangle-exclamation"></i> <span data-eb-en="Damaged, Expired &amp; Lost" data-eb-ur="نقصان و ایکسپائرڈ">Damaged, Expired &amp; Lost</span>
        </button>
        <button class="report-tab-btn" data-tab="bookers">
            <i class="fas fa-users-gear"></i> <span data-eb-en="Booker Performance" data-eb-ur="بکر کارکردگی">Booker Performance</span>
        </button>
        <button class="report-tab-btn" data-tab="khata">
            <i class="fas fa-hand-holding-dollar"></i> <span data-eb-en="Customer Khata Aging" data-eb-ur="کسٹمر کھاتہ ایجنگ">Customer Khata Aging</span>
        </button>
        <button class="report-tab-btn" data-tab="mobile_analytics" id="tabBtnMobileAnalytics" style="display:none; background:#f0f9ff; border-color:#7dd3fc; color:#0369a1;">
            <i class="fas fa-mobile-screen-button" style="color:#0284c7;"></i> <b><span data-eb-en="Mobile, IMEI &amp; Repairing" data-eb-ur="موبائل، IMEI و ریپئرنگ رپورٹ">Mobile, IMEI &amp; Repairing</span></b>
        </button>
        <button class="report-tab-btn" data-tab="books_analytics" id="tabBtnBooksAnalytics" style="display:none; background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8;">
            <i class="fas fa-book-open" style="color:#2563eb;"></i> <b><span data-eb-en="Publisher &amp; Class Analytics" data-eb-ur="کتب و نصاب رپورٹ">Publisher &amp; Class Analytics</span></b>
        </button>
        <button class="report-tab-btn" data-tab="wholesaler_analytics" id="tabBtnWholesalerAnalytics" style="display:none; background:#fff7ed; border-color:#fdba74; color:#c2410c;">
            <i class="fas fa-boxes-stacked" style="color:#ea580c;"></i> <b><span data-eb-en="Wholesale, PJP, Expiry &amp; Schemes" data-eb-ur="ہول سیل و ڈسٹری بیوشن">Wholesale, PJP, Expiry &amp; Schemes</span></b>
        </button>
        <button class="report-tab-btn" data-tab="medical_analytics" id="tabBtnMedicalAnalytics" style="display:none; background:#ecfdf5; border-color:#6ee7b7; color:#047857;">
            <i class="fas fa-pills" style="color:#059669;"></i> <b><span data-eb-en="Pharmacy, Formula &amp; FEFO Expiry" data-eb-ur="میڈیکل و فارمیسی رپورٹ">Pharmacy, Formula &amp; FEFO Expiry</span></b>
        </button>
        <button class="report-tab-btn" data-tab="restaurant_analytics" id="tabBtnRestaurantAnalytics" style="display:none; background:#fef2f2; border-color:#fca5a5; color:#b91c1c;">
            <i class="fas fa-utensils" style="color:#dc2626;"></i> <b><span data-eb-en="Restaurant, Kitchen &amp; Deals" data-eb-ur="ریسٹورنٹ و کچن رپورٹ">Restaurant, Kitchen &amp; Deals</span></b>
        </button>
    </div>

    <!-- ===== 📅 DATE FILTER & ACTION BAR ===== -->
    <div class="date-filter-bar">
        <div class="date-presets" id="datePresets" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <span id="reportsActiveCategoryBadge" style="background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:800; margin-right:4px;"><span data-eb-en="🏢 Category Workspace" data-eb-ur="کیٹیگری ورک اسپیس">🏢 Category Workspace</span></span>
            <button class="date-preset-btn" data-preset="today"><span data-eb-en="Today" data-eb-ur="آج">Today</span></button>
            <button class="date-preset-btn" data-preset="yesterday"><span data-eb-en="Yesterday" data-eb-ur="کل">Yesterday</span></button>
            <button class="date-preset-btn" data-preset="last7"><span data-eb-en="Last 7 Days" data-eb-ur="گزشتہ 7 دن">Last 7 Days</span></button>
            <button class="date-preset-btn active" data-preset="thismonth"><span data-eb-en="This Month" data-eb-ur="یہ مہینہ">This Month</span></button>
            <button class="date-preset-btn" data-preset="lastmonth"><span data-eb-en="Last Month" data-eb-ur="پچھلا مہینہ">Last Month</span></button>
            <button class="date-preset-btn" data-preset="alltime"><span data-eb-en="All Time" data-eb-ur="مکمل ریکارڈ">All Time</span></button>
        </div>

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <div class="custom-date-inputs">
                <input type="date" id="dateStart" title="Start Date">
                <span style="font-size:12px; color:#64748b; font-weight:bold;" data-eb-en="to" data-eb-ur="تا">to</span>
                <input type="date" id="dateEnd" title="End Date">
                <button class="btn btn-sm" id="btnApplyDate" style="background:#0284c7; color:#fff;">
                    <span data-eb-en="Apply" data-eb-ur="لاگو کریں">Apply</span>
                </button>
            </div>
            
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="btn btn-sm btn-export-csv" id="btnExportCSV" style="background:#10b981; color:#fff;" title="Download Excel CSV">
                    <i class="fas fa-file-excel"></i> <span data-eb-en="Export CSV" data-eb-ur="ایکسپورٹ">Export CSV</span>
                </button>
                <button class="btn btn-sm" id="btnThermalReport" style="background:#0f172a; color:#38bdf8; border:1px solid #0284c7; font-weight:800;" title="Print 80mm/58mm Thermal Closing Summary Slip">
                    <span data-eb-en="🧾 Thermal Slip" data-eb-ur="تھرمل سلپ">🧾 Thermal Slip</span>
                </button>
                <button class="btn btn-sm btn-print-report" id="btnPrintReport" style="background:#475569; color:#fff;" title="Print Full Report">
                    <i class="fas fa-print"></i> <span data-eb-en="Print" data-eb-ur="پرنٹ">Print</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 📊 DYNAMIC REPORT CONTENT CONTAINER ===== -->
    <div class="panel-card" id="reportContentCard">
        <!-- KPI Metrics Grid (Injected dynamically) -->
        <div class="kpi-grid" id="kpiGrid"></div>

        <!-- Report Table Header with Search -->
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px;">
            <div style="min-width:0; max-width:100%;">
                <h2 id="reportTitle"><i class="fas fa-file-lines"></i> <span data-eb-en="Sales Report" data-eb-ur="سیلز رپورٹ">Sales Report</span></h2>
                <small class="header-note" id="reportSubTitle" data-eb-en="Loading report metrics..." data-eb-ur="رپورٹ کے اعداد و شمار لوڈ ہو رہے ہیں..." data-eb-compact="1">Loading report metrics...</small>
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; max-width:100%; min-width:0;">
                <select id="mobileAnalyticsModeSelect" style="display:none; max-width:100%; box-sizing:border-box; padding:6px 10px; border:1px solid #7dd3fc; border-radius:8px; font-size:12px; font-weight:700; color:#0369a1; background:#f0f9ff; outline:none; cursor:pointer;">
                    <option value="brand" data-eb-en="📱 Brand &amp; Model Analytics" data-eb-ur="📱 Brand &amp; Model Analytics (برانڈ اور ماڈل کے لحاظ سے سیلز و اسٹاک)">📱 Brand &amp; Model Analytics</option>
                    <option value="imei_audit" data-eb-en="🔢 Sold &amp; In-Stock IMEI Register" data-eb-ur="🔢 Sold &amp; In-Stock IMEI Register (فروخت شدہ اور موجودہ IMEI رجسٹر)">🔢 Sold &amp; In-Stock IMEI Register</option>
                    <option value="repair_lab" data-eb-en="🛠️ Repairing Lab &amp; Technician Jobs" data-eb-ur="🛠️ Repairing Lab &amp; Technician Jobs (ریپئرنگ لیب، ٹوکنز اور کاریگر رپورٹ)">🛠️ Repairing Lab &amp; Technician Jobs</option>
                    <option value="exchange_used" data-eb-en="🔄 Used Phone &amp; Exchange Trade-In Register" data-eb-ur="🔄 Used Phone &amp; Exchange Trade-In Register (ایکسچینج اور استعمال شدہ موبائل رپورٹ)">🔄 Used Phone &amp; Exchange Trade-In Register</option>
                </select>
                <select id="booksAnalyticsModeSelect" style="display:none; max-width:100%; box-sizing:border-box; padding:6px 10px; border:1px solid #93c5fd; border-radius:8px; font-size:12px; font-weight:700; color:#1e40af; background:#eff6ff; outline:none; cursor:pointer;">
                    <option value="publisher" data-eb-en="🏛️ Group by Publisher / Brand" data-eb-ur="🏛️ Group by Publisher / Brand (پبلشر و برانڈ کے لحاظ سے)">🏛️ Group by Publisher / Brand</option>
                    <option value="class" data-eb-en="🎓 Group by Class / Grade" data-eb-ur="🎓 Group by Class / Grade (کلاس و جماعت کے لحاظ سے)">🎓 Group by Class / Grade</option>
                    <option value="subject" data-eb-en="📖 Group by Subject / Item Type" data-eb-ur="📖 Group by Subject / Item Type (مضمون و قسم کے لحاظ سے)">📖 Group by Subject / Item Type</option>
                </select>
                <select id="wholesalerAnalyticsModeSelect" style="display:none; max-width:100%; box-sizing:border-box; padding:6px 10px; border:1px solid #fdba74; border-radius:8px; font-size:12px; font-weight:700; color:#c2410c; background:#fff7ed; outline:none; cursor:pointer;">
                    <option value="principal_company" data-eb-en="🏭 Principal Company / Brand Sales &amp; Stock" data-eb-ur="🏭 Principal Company / Brand Sales &amp; Stock (کمپنی و برانڈ رپورٹ)">🏭 Principal Company / Brand Sales &amp; Stock</option>
                    <option value="pjp_route" data-eb-en="🗺️ PJP Beat / Route Sales &amp; Khata" data-eb-ur="🗺️ PJP Beat / Route Sales &amp; Khata (روٹ / بیٹ سیلز و ریکوری)">🗺️ PJP Beat / Route Sales &amp; Khata</option>
                    <option value="expiry_batch" data-eb-en="⏳ Batch Expiry Radar &amp; Damage Claims" data-eb-ur="⏳ Batch Expiry Radar &amp; Damage Claims (ایکسپائری و کلیمز رپورٹ)">⏳ Batch Expiry Radar &amp; Damage Claims</option>
                    <option value="scheme_bonus" data-eb-en="🎁 Free Bonus (TP) &amp; Trade Schemes Audit" data-eb-ur="🎁 Free Bonus (TP) &amp; Trade Schemes Audit (مفت بونس و اسکیم آڈٹ)">🎁 Free Bonus (TP) &amp; Trade Schemes Audit</option>
                </select>
                <select id="medicalAnalyticsModeSelect" style="display:none; max-width:100%; box-sizing:border-box; padding:6px 10px; border:1px solid #6ee7b7; border-radius:8px; font-size:12px; font-weight:700; color:#047857; background:#ecfdf5; outline:none; cursor:pointer;">
                    <option value="pharma_company" data-eb-en="🏥 Pharma Company / Brand Sales &amp; Stock" data-eb-ur="🏥 Pharma Company / Brand Sales &amp; Stock (فارما کمپنی رپورٹ)">🏥 Pharma Company / Brand Sales &amp; Stock</option>
                    <option value="generic_formula" data-eb-en="🧬 Generic Salt / Formula Demand &amp; Stock" data-eb-ur="🧬 Generic Salt / Formula Demand &amp; Stock (جنیرک فارمولا رپورٹ)">🧬 Generic Salt / Formula Demand &amp; Stock</option>
                    <option value="expiry_fefo" data-eb-en="⏳ FEFO Batch Expiry Radar &amp; Pharma Claims" data-eb-ur="⏳ FEFO Batch Expiry Radar &amp; Pharma Claims (ایکسپائری و کلیم ریڈار)">⏳ FEFO Batch Expiry Radar &amp; Pharma Claims</option>
                    <option value="rack_schedule" data-eb-en="🗄️ Rack Location, Cold-Chain (2-8°C) &amp; Rx Audit" data-eb-ur="🗄️ Rack Location, Cold-Chain (2-8°C) &amp; Rx Audit (ریک و فریج رپورٹ)">🗄️ Rack Location, Cold-Chain (2-8°C) &amp; Rx Audit</option>
                </select>
                <select id="restaurantAnalyticsModeSelect" style="display:none; max-width:100%; box-sizing:border-box; padding:6px 10px; border:1px solid #fca5a5; border-radius:8px; font-size:12px; font-weight:700; color:#b91c1c; background:#fef2f2; outline:none; cursor:pointer;">
                    <option value="kitchen_station" data-eb-en="👨‍🍳 Kitchen Station / Brand Sales &amp; Pantry Stock" data-eb-ur="👨‍🍳 Kitchen Station / Brand Sales &amp; Pantry Stock (کچن کاؤنٹر و اسٹاک)">👨‍🍳 Kitchen Station / Brand Sales &amp; Pantry Stock</option>
                    <option value="service_channel" data-eb-en="🍽️ Service Mode, Table / Delivery &amp; Rider Sales" data-eb-ur="🍽️ Service Mode, Table / Delivery &amp; Rider Sales (سروس موڈ و رائیڈر)">🍽️ Service Mode, Table / Delivery &amp; Rider Sales</option>
                    <option value="deals_combos" data-eb-en="🎁 Combo Deals, Sizes &amp; Food-Cost Margin" data-eb-ur="🎁 Combo Deals, Sizes &amp; Food-Cost Margin (ڈیلز و مارجن تجزیہ)">🎁 Combo Deals, Sizes &amp; Food-Cost Margin</option>
                    <option value="wastage_claims" data-eb-en="🔥 Kitchen Wastage, Freezer Spoilage &amp; Cancelled Orders" data-eb-ur="🔥 Kitchen Wastage, Freezer Spoilage &amp; Cancelled Orders (کچن ویسٹیج و کلیمز)">🔥 Kitchen Wastage, Freezer Spoilage &amp; Cancelled Orders</option>
                </select>
                <div style="position:relative; width:100%; max-width:260px;">
                    <i class="fas fa-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:12px;"></i>
                    <input type="text" id="reportSearchInput" placeholder="Quick filter in results..." data-eb-ph-en="Quick filter in results..." data-eb-ph-ur="Quick filter in results... (نتائج میں تلاش کریں)" style="width:100%; padding:6px 10px 6px 30px; border:1px solid #cbd5e1; border-radius:8px; font-size:12px; outline:none;">
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-responsive" id="tableContainer">
            <div class="loading-inline" data-eb-en="Loading report data..." data-eb-ur="رپورٹ ڈیٹا لوڈ ہو رہا ہے...">Loading report data...</div>
        </div>
    </div>

</div>

<!-- Firebase SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- 🏢 BUSINESS CATEGORIES REGISTRY -->
<script src="business-categories.js"></script>
<!-- 🧭 SIDEBAR SYSTEM -->
<script src="sidebar.js"></script>
<!-- 📊 REPORTS ENGINE SCRIPT -->
<script src="reports.js"></script>
</body>
</html>
