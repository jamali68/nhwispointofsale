<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 📱 Progressive Web App (PWA) Standards -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NH POS">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NH POS — Advanced Reports Engine</title>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Panels & Global CSS -->
    <link rel="stylesheet" href="panels.css">

    <!-- Reports CSS -->
    <link rel="stylesheet" href="reports.css">

    <!-- Global Dark Theme & Theme Sync -->
    <link rel="stylesheet" href="dark-theme.css">
    <script src="theme-sync.js"></script>
</head>
<body>

<div class="panel-container" style="margin-top: 8px;">

    <!-- ===== 📑 REPORT TABS NAVIGATION ===== -->
    <div class="report-tabs-nav" id="reportTabsNav">
        <a href="profit.html" class="report-tab-btn" style="background:#f0fdf4; border-color:#86efac; color:#15803d; text-decoration:none;">
            <i class="fas fa-sack-dollar" style="color:#10b981;"></i> <b>Profit Analytics (منافع)</b>
        </a>
        <button class="report-tab-btn active" data-tab="sales">
            <i class="fas fa-chart-line"></i> Sales &amp; Revenue
        </button>
        <button class="report-tab-btn" data-tab="bestsellers">
            <i class="fas fa-trophy"></i> Best Sellers
        </button>
        <button class="report-tab-btn" data-tab="slow">
            <i class="fas fa-hourglass-half"></i> Slow &amp; Dead Stock
        </button>
        <button class="report-tab-btn" data-tab="claims">
            <i class="fas fa-rotate-left"></i> Claims &amp; Customer Returns
        </button>
        <button class="report-tab-btn" data-tab="damage">
            <i class="fas fa-triangle-exclamation"></i> Damaged, Expired &amp; Lost
        </button>
        <button class="report-tab-btn" data-tab="bookers">
            <i class="fas fa-users-gear"></i> Booker Performance
        </button>
        <button class="report-tab-btn" data-tab="khata">
            <i class="fas fa-hand-holding-dollar"></i> Customer Khata Aging
        </button>
        <button class="report-tab-btn" data-tab="mobile_analytics" id="tabBtnMobileAnalytics" style="background:#f0f9ff; border-color:#7dd3fc; color:#0369a1;">
            <i class="fas fa-mobile-screen-button" style="color:#0284c7;"></i> <b>Mobile, IMEI &amp; Repairing (موبائل، IMEI و ریپئرنگ رپورٹ)</b>
        </button>
        <button class="report-tab-btn" data-tab="books_analytics" id="tabBtnBooksAnalytics" style="background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8;">
            <i class="fas fa-book-open" style="color:#2563eb;"></i> <b>Publisher &amp; Class Analytics (کتب و نصاب رپورٹ)</b>
        </button>
        <button class="report-tab-btn" data-tab="wholesaler_analytics" id="tabBtnWholesalerAnalytics" style="background:#fff7ed; border-color:#fdba74; color:#c2410c;">
            <i class="fas fa-boxes-stacked" style="color:#ea580c;"></i> <b>Wholesale, PJP, Expiry &amp; Schemes (ہول سیل و ڈسٹری بیوشن)</b>
        </button>
    </div>

    <!-- ===== 📅 DATE FILTER & ACTION BAR ===== -->
    <div class="date-filter-bar">
        <div class="date-presets" id="datePresets">
            <button class="date-preset-btn" data-preset="today">Today</button>
            <button class="date-preset-btn" data-preset="yesterday">Yesterday</button>
            <button class="date-preset-btn" data-preset="last7">Last 7 Days</button>
            <button class="date-preset-btn active" data-preset="thismonth">This Month</button>
            <button class="date-preset-btn" data-preset="lastmonth">Last Month</button>
        </div>

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <div class="custom-date-inputs">
                <input type="date" id="dateStart" title="Start Date">
                <span style="font-size:12px; color:#64748b; font-weight:bold;">to</span>
                <input type="date" id="dateEnd" title="End Date">
                <button class="btn btn-sm" id="btnApplyDate" style="background:#0284c7; color:#fff;">
                    Apply
                </button>
            </div>
            
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="btn btn-sm btn-export-csv" id="btnExportCSV" style="background:#10b981; color:#fff;" title="Download Excel CSV">
                    <i class="fas fa-file-excel"></i> Export CSV
                </button>
                <button class="btn btn-sm" id="btnThermalReport" style="background:#0f172a; color:#38bdf8; border:1px solid #0284c7; font-weight:800;" title="Print 80mm/58mm Thermal Closing Summary Slip">
                    🧾 Thermal Slip
                </button>
                <button class="btn btn-sm btn-print-report" id="btnPrintReport" style="background:#475569; color:#fff;" title="Print Full Report">
                    <i class="fas fa-print"></i> Print
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 📊 DYNAMIC REPORT CONTENT CONTAINER ===== -->
    <div class="panel-card" id="reportContentCard">
        <!-- KPI Metrics Grid (Injected dynamically) -->
        <div class="kpi-grid" id="kpiGrid"></div>

        <!-- Report Table Header with Search -->
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:10px;">
            <div>
                <h2 id="reportTitle"><i class="fas fa-file-lines"></i> Sales Report</h2>
                <small class="header-note" id="reportSubTitle">Loading report metrics...</small>
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <select id="mobileAnalyticsModeSelect" style="display:none; padding:6px 10px; border:1px solid #7dd3fc; border-radius:8px; font-size:12px; font-weight:700; color:#0369a1; background:#f0f9ff; outline:none; cursor:pointer;">
                    <option value="brand">📱 Brand &amp; Model Analytics (برانڈ اور ماڈل کے لحاظ سے سیلز و اسٹاک)</option>
                    <option value="imei_audit">🔢 Sold &amp; In-Stock IMEI Register (فروخت شدہ اور موجودہ IMEI رجسٹر)</option>
                    <option value="repair_lab">🛠️ Repairing Lab &amp; Technician Jobs (ریپئرنگ لیب، ٹوکنز اور کاریگر رپورٹ)</option>
                    <option value="exchange_used">🔄 Used Phone &amp; Exchange Trade-In Register (ایکسچینج اور استعمال شدہ موبائل رپورٹ)</option>
                </select>
                <select id="booksAnalyticsModeSelect" style="display:none; padding:6px 10px; border:1px solid #93c5fd; border-radius:8px; font-size:12px; font-weight:700; color:#1e40af; background:#eff6ff; outline:none; cursor:pointer;">
                    <option value="publisher">🏛️ Group by Publisher / Brand (پبلشر و برانڈ کے لحاظ سے)</option>
                    <option value="class">🎓 Group by Class / Grade (کلاس و جماعت کے لحاظ سے)</option>
                    <option value="subject">📖 Group by Subject / Item Type (مضمون و قسم کے لحاظ سے)</option>
                </select>
                <select id="wholesalerAnalyticsModeSelect" style="display:none; padding:6px 10px; border:1px solid #fdba74; border-radius:8px; font-size:12px; font-weight:700; color:#c2410c; background:#fff7ed; outline:none; cursor:pointer;">
                    <option value="principal_company">🏭 Principal Company / Brand Sales &amp; Stock (کمپنی و برانڈ رپورٹ)</option>
                    <option value="pjp_route">🗺️ PJP Beat / Route Sales &amp; Khata (روٹ / بیٹ سیلز و ریکوری)</option>
                    <option value="expiry_batch">⏳ Batch Expiry Radar &amp; Damage Claims (ایکسپائری و کلیمز رپورٹ)</option>
                    <option value="scheme_bonus">🎁 Free Bonus (TP) &amp; Trade Schemes Audit (مفت بونس و اسکیم آڈٹ)</option>
                </select>
                <div style="position:relative; width:100%; max-width:260px;">
                    <i class="fas fa-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:12px;"></i>
                    <input type="text" id="reportSearchInput" placeholder="Quick filter in results..." style="width:100%; padding:6px 10px 6px 30px; border:1px solid #cbd5e1; border-radius:8px; font-size:12px; outline:none;">
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-responsive" id="tableContainer">
            <div class="loading-inline">Loading report data...</div>
        </div>
    </div>

</div>

<!-- Firebase SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- 🏢 BUSINESS CATEGORIES REGISTRY -->
<script src="business-categories.js"></script>
<!-- 🧭 SIDEBAR SYSTEM -->
<script src="sidebar.js"></script>
<!-- 📊 REPORTS ENGINE SCRIPT -->
<script src="reports.js"></script>
</body>
</html>
